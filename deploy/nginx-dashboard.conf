# Publishes the dashboard at https://ataraxia-bot.com/dashboard/
#
# Install:  cp deploy/nginx-dashboard.conf /etc/nginx/snippets/ataraxia-dashboard.conf
# then add inside the "listen 443 ssl" server block of
# /etc/nginx/sites-enabled/ataraxia-bot.com:
#     include /etc/nginx/snippets/ataraxia-dashboard.conf;
# and run:  nginx -t && systemctl reload nginx
#
# .env must then contain  DASHBOARD_BASE_URL=https://ataraxia-bot.com/dashboard

location = /dashboard {
    return 301 /dashboard/;
}

location /dashboard/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
